# Apache terpisah khusus SIM Kinerja untuk akses online (port 18081, hanya dari komputer ini).
# Port 8081 sudah dipakai aplikasi SIRKAT, jadi sengaja tidak dipakai di sini.
# Hanya folder aplikasi yang disajikan: phpMyAdmin dan dasbor XAMPP TIDAK ikut terbuka.
ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:18081
ServerName localhost:18081
PidFile "C:/xampp/htdocs/simkinerja/online/apache-online.pid"
ServerTokens Prod
ServerSignature Off

<IfModule mpm_winnt_module>
    ThreadsPerChild 25
    MaxConnectionsPerChild 0
</IfModule>

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so

TypesConfig conf/mime.types
LoadFile "C:/xampp/php/php8ts.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "C:/xampp/htdocs/simkinerja"
<Directory "C:/xampp/htdocs/simkinerja">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
DirectoryIndex index.php

ErrorLog "C:/xampp/htdocs/simkinerja/logs/apache-online-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "C:/xampp/htdocs/simkinerja/logs/apache-online-akses.log" common
